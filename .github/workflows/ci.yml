name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: |
          cd depsy-lsp
          cargo fmt --check

      - name: Clippy
        run: |
          cd depsy-lsp
          cargo clippy -- -D warnings

      - name: Run tests
        run: |
          cd depsy-lsp
          cargo test

      - name: Check rustdoc
        run: |
          cd depsy-lsp
          cargo doc --no-deps

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: depsy-lsp

  build-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Build extension
        run: |
          cd depsy-zed
          cargo build --release --target wasm32-wasip1

  docs-validation:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs

      - name: Build documentation
        run: |
          cd docs
          bundle exec jekyll build --baseurl "/zed-depsy"
        env:
          JEKYLL_ENV: production

      - name: Validate mermaid blocks
        run: bash ./scripts/check_mermaid_syntax.sh docs/architecture.md

      - name: Validate links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-loopback docs/architecture.md
          fail: true
